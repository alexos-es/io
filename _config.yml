title: "Información Ordenada"
email: "hola@informacionordenada.es"
description: "Presencia técnica permanente y tranquilidad digital para autónomos y pequeños negocios."
baseurl: "" # el repositorio de usuario/proyecto puede requerir baseurl
url: "https://informacionordenada.es"     # se completará automáticamente en GitHub Pages
lang: es
timezone: "Europe/Madrid"

# Documentación y versiones de trabajo: conservar en Git, fuera de la web.
exclude:
  - README.md
  - README_FIX_NOTES.md
  - vista-previa.html
  - new-site
  - preview.png
  - preview.jpg

# Colección de casos de éxito
collections:
  content:
    output: true
    permalink: /:path/

# Markdown y plugins compatibles con GitHub Pages
markdown: kramdown
kramdown:
  input: GFM

# Configuración de construcción de GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
